<!DOCTYPE html>
<html>
<head>
<title>Admin - Global Peak Trading</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#0a0f1e;color:white;text-align:center;padding:20px}
.box{background:#1a2340;padding:20px;border-radius:10px;max-width:350px;margin:auto}
input{width:90%;padding:10px;margin:8px;border-radius:5px;border:none}
button{padding:10px 20px;background:#00ff88;border:none;border-radius:5px;font-weight:bold}
a{color:#00ff88}
</style>
</head>
<body>
<h1>ADMIN LOGIN</h1>
<div class="box">
<p>Global Peak Trading Admin</p>
<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">
<br><br>
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>
<br>
<a href="index.html">← Back to Home</a>
<script>
function login(){
var u=document.getElementById('user').value;
var p=document.getElementById('pass').value;
if(u=="admin" && p=="admin123"){
document.getElementById('msg').innerHTML="Welcome Admin! Dashboard coming soon.";
}else{
document.getElementById('msg').innerHTML="Wrong username or password";
}
}
</script>
</body>
                                 </html>
